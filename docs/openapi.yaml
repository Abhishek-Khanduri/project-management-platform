openapi: 3.0.3
info:
  title: Project Management Platform API
  version: 1.0.0
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        JWTs cannot be "deleted", so logout blacklists the refresh token.
        After this, the refresh token can no longer be used to get new access tokens.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Logout'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: The currently logged-in user.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Create a new account. Returns the user (log in separately to get
        tokens).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/verify/:
    post:
      operationId: auth_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerify'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerify'
          description: ''
  /api/dashboard/:
    get:
      operationId: dashboard_retrieve
      description: Statistics across every project the current user is a member of.
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
  /api/projects/:
    get:
      operationId: projects_list
      description: |-
        /api/projects/                              GET list, POST create
        /api/projects/{id}/                         GET, PUT, PATCH, DELETE
        /api/projects/{id}/members/                 GET list, POST add (by email)
        /api/projects/{id}/members/{user_id}/       DELETE remove
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Matches the project name
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - archived
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectList'
          description: ''
    post:
      operationId: projects_create
      description: |-
        /api/projects/                              GET list, POST create
        /api/projects/{id}/                         GET, PUT, PATCH, DELETE
        /api/projects/{id}/members/                 GET list, POST add (by email)
        /api/projects/{id}/members/{user_id}/       DELETE remove
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/projects/{id}/:
    get:
      operationId: projects_retrieve
      description: |-
        /api/projects/                              GET list, POST create
        /api/projects/{id}/                         GET, PUT, PATCH, DELETE
        /api/projects/{id}/members/                 GET list, POST add (by email)
        /api/projects/{id}/members/{user_id}/       DELETE remove
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    put:
      operationId: projects_update
      description: |-
        /api/projects/                              GET list, POST create
        /api/projects/{id}/                         GET, PUT, PATCH, DELETE
        /api/projects/{id}/members/                 GET list, POST add (by email)
        /api/projects/{id}/members/{user_id}/       DELETE remove
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Project'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Project'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    patch:
      operationId: projects_partial_update
      description: |-
        /api/projects/                              GET list, POST create
        /api/projects/{id}/                         GET, PUT, PATCH, DELETE
        /api/projects/{id}/members/                 GET list, POST add (by email)
        /api/projects/{id}/members/{user_id}/       DELETE remove
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProject'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProject'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    delete:
      operationId: projects_destroy
      description: |-
        /api/projects/                              GET list, POST create
        /api/projects/{id}/                         GET, PUT, PATCH, DELETE
        /api/projects/{id}/members/                 GET list, POST add (by email)
        /api/projects/{id}/members/{user_id}/       DELETE remove
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/projects/{id}/members/:
    get:
      operationId: projects_members_retrieve
      description: |-
        /api/projects/                              GET list, POST create
        /api/projects/{id}/                         GET, PUT, PATCH, DELETE
        /api/projects/{id}/members/                 GET list, POST add (by email)
        /api/projects/{id}/members/{user_id}/       DELETE remove
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
    post:
      operationId: projects_members_create
      description: |-
        /api/projects/                              GET list, POST create
        /api/projects/{id}/                         GET, PUT, PATCH, DELETE
        /api/projects/{id}/members/                 GET list, POST add (by email)
        /api/projects/{id}/members/{user_id}/       DELETE remove
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Member'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Member'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Member'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
  /api/projects/{id}/members/{user_id}/:
    delete:
      operationId: projects_members_destroy
      description: |-
        /api/projects/                              GET list, POST create
        /api/projects/{id}/                         GET, PUT, PATCH, DELETE
        /api/projects/{id}/members/                 GET list, POST add (by email)
        /api/projects/{id}/members/{user_id}/       DELETE remove
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this project.
        required: true
      - in: path
        name: user_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/projects/{project_id}/tasks/:
    get:
      operationId: projects_tasks_list
      description: /api/projects/{project_id}/tasks/    GET list (search, filter,
        paginate), POST create
      parameters:
      - in: query
        name: assignee
        schema:
          type: integer
        description: Assignee's user id
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - high
          - low
          - medium
      - in: path
        name: project_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: query
        name: search
        schema:
          type: string
        description: Matches the title or description
      - in: query
        name: status
        schema:
          type: string
          enum:
          - completed
          - in_progress
          - todo
      tags:
      - projects
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTaskList'
          description: ''
    post:
      operationId: projects_tasks_create
      description: /api/projects/{project_id}/tasks/    GET list (search, filter,
        paginate), POST create
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Task'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Task'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/tasks/{id}/:
    get:
      operationId: tasks_retrieve
      description: /api/tasks/{id}/    GET, PUT, PATCH, DELETE
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - tasks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    put:
      operationId: tasks_update
      description: /api/tasks/{id}/    GET, PUT, PATCH, DELETE
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Task'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Task'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    patch:
      operationId: tasks_partial_update
      description: /api/tasks/{id}/    GET, PUT, PATCH, DELETE
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTask'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTask'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTask'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    delete:
      operationId: tasks_destroy
      description: /api/tasks/{id}/    GET, PUT, PATCH, DELETE
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this task.
        required: true
      tags:
      - tasks
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    Dashboard:
      type: object
      properties:
        total_projects:
          type: integer
        active_projects:
          type: integer
        total_tasks:
          type: integer
        completed_tasks:
          type: integer
        pending_tasks:
          type: integer
      required:
      - active_projects
      - completed_tasks
      - pending_tasks
      - total_projects
      - total_tasks
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    Member:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        is_owner:
          type: boolean
          readOnly: true
        joined_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - email
      - first_name
      - id
      - is_owner
      - joined_at
      - last_name
    PaginatedProjectList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    PaginatedTaskList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Task'
    PatchedProject:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        description:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatusEnum'
        owner:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        member_count:
          type: integer
          readOnly: true
        task_count:
          type: integer
          readOnly: true
        permissions:
          type: object
          additionalProperties: {}
          description: What the current user may do, so the UI can show/hide buttons.
            Decided by the same policies.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedTask:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatusEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        assignee:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        assignee_id:
          type: integer
          writeOnly: true
          nullable: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        due_date:
          type: string
          format: date
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        permissions:
          type: object
          additionalProperties: {}
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PriorityEnum:
      enum:
      - low
      - medium
      - high
      type: string
      description: |-
        * `low` - Low
        * `medium` - Medium
        * `high` - High
    Project:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        description:
          type: string
        status:
          $ref: '#/components/schemas/ProjectStatusEnum'
        owner:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        member_count:
          type: integer
          readOnly: true
        task_count:
          type: integer
          readOnly: true
        permissions:
          type: object
          additionalProperties: {}
          description: What the current user may do, so the UI can show/hide buttons.
            Decided by the same policies.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - member_count
      - name
      - owner
      - permissions
      - task_count
      - updated_at
    ProjectStatusEnum:
      enum:
      - active
      - archived
      type: string
      description: |-
        * `active` - Active
        * `archived` - Archived
    Register:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
      required:
      - email
      - id
      - password
    Task:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatusEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        assignee:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        assignee_id:
          type: integer
          writeOnly: true
          nullable: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        due_date:
          type: string
          format: date
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        permissions:
          type: object
          additionalProperties: {}
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assignee
      - completed_at
      - created_at
      - created_by
      - id
      - permissions
      - project
      - title
      - updated_at
    TaskStatusEnum:
      enum:
      - todo
      - in_progress
      - completed
      type: string
      description: |-
        * `todo` - Todo
        * `in_progress` - In Progress
        * `completed` - Completed
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenVerify:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
